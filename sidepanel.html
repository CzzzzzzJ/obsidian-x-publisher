<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>麦当发布助手</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>麦当发布助手</h1>
    <p class="sub">只填写、不发布，最后由你点发布</p>
    <nav class="tabs">
      <button data-view="video" class="tab on">视频分发</button>
      <button data-view="article" class="tab">X 长文</button>
    </nav>
  </header>

  <main id="view-video">
    <section class="card">
      <div class="row">
        <div>
          <div class="label">NAS 发布目录</div>
          <div id="nasName" class="value">未选择</div>
        </div>
        <div class="actions">
          <button id="btnNasRegrant" class="hidden">授权</button>
          <button id="btnNasRescan" class="ghost hidden">刷新</button>
          <button id="btnNasPick" class="ghost">选择</button>
        </div>
      </div>
      <label class="opt path">本机路径 <input id="nasPath" type="text" spellcheck="false"></label>
    </section>

    <section class="card">
      <div class="label">发布工程 <span class="hint">目录里有 publish.json 的</span></div>
      <ul id="projects" class="notes"></ul>
    </section>

    <section class="card hidden" id="projCard">
      <div id="projTitle" class="pv-title"></div>
      <div id="projMeta" class="pv-meta"></div>
      <ul id="projCheck" class="warn"></ul>
      <ul id="platList" class="plats"></ul>
      <div class="buttons">
        <button id="btnPublish" class="primary" disabled>一键填写所选平台</button>
        <button id="btnPubStop" class="ghost hidden">停止</button>
      </div>
    </section>

    <section id="statusList"></section>
  </main>

  <main id="view-article" class="hidden">
  <section class="card" id="vaultCard">
    <div class="row">
      <div>
        <div class="label">Obsidian 库</div>
        <div id="vaultName" class="value">未选择</div>
      </div>
      <div class="actions">
        <button id="btnRegrant" class="hidden">授权</button>
        <button id="btnRescan" class="ghost hidden" title="重新扫描">刷新</button>
        <button id="btnPick" class="ghost">选择</button>
      </div>
    </div>
  </section>

  <section class="card" id="noteCard">
    <div class="label">选择笔记 <span class="hint">按最近修改排序</span></div>
    <input id="search" type="search" placeholder="搜索笔记名或路径…" disabled>
    <ul id="notes" class="notes"></ul>
  </section>

  <section class="card hidden" id="previewCard">
    <div class="label">预览</div>
    <div id="pvTitle" class="pv-title"></div>
    <div id="pvMeta" class="pv-meta"></div>
    <ol id="pvList" class="pv-list"></ol>
    <ul id="pvWarn" class="warn"></ul>
  </section>

  <section class="card" id="runCard">
    <div id="target" class="target">检测编辑页中…</div>
    <label class="opt"><input type="checkbox" id="optVerify" checked> 插入后逐段核对，漏掉的自动补回</label>
    <label class="opt">每张图上传后等待 <input type="number" id="optSettle" min="3" max="60" value="12"> 秒再继续</label>
    <div class="buttons">
      <button id="btnRun" class="primary" disabled>插入到当前长文草稿</button>
      <button id="btnStop" class="ghost hidden">停止</button>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <ol id="log" class="log"></ol>
  </section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
